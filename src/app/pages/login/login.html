<div class="min-h-screen w-full flex items-center justify-center bg-[#05070a] font-sans relative overflow-hidden p-6 select-none">
  
  <!-- Dynamic Background Glow & Aurora Effects -->
  <div class="absolute -top-40 -left-40 w-[600px] h-[600px] bg-amber-500/10 rounded-full blur-[160px] animate-pulse pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-[600px] h-[600px] bg-yellow-500/10 rounded-full blur-[160px] animate-pulse pointer-events-none" style="animation-duration: 5s;"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-gradient-to-tr from-amber-600/5 to-yellow-500/5 rounded-full blur-[180px] pointer-events-none"></div>

  <!-- Subtle Tech Grid Overlay -->
  <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] opacity-15 pointer-events-none"></div>

  <!-- Main Login Card -->
  <div class="w-full max-w-4xl bg-[#0d1117]/80 backdrop-blur-3xl border border-slate-800/80 rounded-[2.5rem] shadow-[0_25px_60px_-15px_rgba(0,0,0,0.9)] overflow-hidden grid grid-cols-1 lg:grid-cols-12 relative z-10 transition-all duration-500 hover:border-amber-500/30">
    
    <!-- ฝั่งซ้าย: แบรนดิ้งมหาลัย -->
    <div class="lg:col-span-5 bg-gradient-to-br from-[#0b0f15] to-[#040609] p-10 lg:p-14 flex flex-col justify-between border-b lg:border-b-0 lg:border-r border-slate-800/60 relative overflow-hidden">
      <div class="absolute top-0 right-0 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <div class="space-y-6 relative z-10">
        <div class="w-10 h-10 rounded-2xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 font-bold shadow-inner">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        </div>

        <div class="space-y-2">
          <h1 class="text-2xl lg:text-3xl font-light text-white tracking-wide">
            Mahasarakham <span class="font-bold text-amber-400">University</span>
          </h1>
          <p class="text-xs font-mono tracking-widest text-slate-500 uppercase">
            Academic Registration System
          </p>
        </div>
      </div>

      <!-- Center Accent -->
      <div class="py-8 space-y-3 relative z-10">
        <div class="w-8 h-[2px] bg-amber-500/50"></div>
        <p class="text-xs text-slate-400 font-light leading-relaxed">
          ระบบสารสนเทศเพื่อการบริการการศึกษา พัฒนาขึ้นเพื่อความรวดเร็วและแม่นยำสูงสุด
        </p>
      </div>

      <!-- Footer Info -->
      <div class="text-[11px] text-slate-600 font-mono relative z-10">
        SECURE PORTAL • 2026
      </div>
    </div>

    <!-- ฝั่งขวา: ฟอร์มเข้าสู่ระบบ -->
    <div class="lg:col-span-7 p-10 lg:p-14 flex flex-col justify-center space-y-8 bg-[#0d1117]/40 relative">
      <div class="space-y-1.5">
        <h2 class="text-2xl font-semibold text-white tracking-tight">เข้าสู่ระบบ</h2>
        <p class="text-xs text-slate-400">ระบุรหัสนิสิตและรหัสผ่านเพื่อดำเนินการต่อ</p>
      </div>

      <!-- ผูกฟอร์มเข้ากับฟังก์ชัน onLogin ใน TS -->
      <form class="space-y-5" (submit)="onLogin($event)">
        
        <!-- รหัสนิสิต -->
        <div class="space-y-2">
          <label class="text-xs font-medium text-slate-400">รหัสนิสิต</label>
          <div class="relative group">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-600 group-focus-within:text-amber-400 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </span>
            <!-- ผูกตัวแปร studentId ด้วย [(ngModel)] ถูกต้อง -->
            <input type="text" [(ngModel)]="studentId" name="studentId" placeholder="รหัสนิสิต" required class="w-full pl-11 pr-4 py-3.5 bg-[#040609] border border-slate-800/80 rounded-xl focus:outline-none focus:border-amber-500 text-white text-sm font-medium transition-all placeholder:text-slate-700">
          </div>
        </div>

        <!-- รหัสผ่าน -->
        <div class="space-y-2">
          <label class="text-xs font-medium text-slate-400">รหัสผ่าน</label>
          <div class="relative group">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-600 group-focus-within:text-amber-400 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </span>
            <!-- ผูกตัวแปร password ด้วย [(ngModel)] ถูกต้อง -->
            <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required class="w-full pl-11 pr-4 py-3.5 bg-[#040609] border border-slate-800/80 rounded-xl focus:outline-none focus:border-amber-500 text-white text-sm font-medium transition-all placeholder:text-slate-700">
          </div>
        </div>

        <!-- ปุ่มกดเข้าสู่ระบบ -->
        <div class="pt-3">
          <button type="submit" class="relative group overflow-hidden w-full py-4 bg-gradient-to-r from-amber-500 via-yellow-500 to-amber-400 text-slate-950 font-black rounded-2xl shadow-xl shadow-amber-500/20 transition-all duration-300 flex items-center justify-center gap-2 text-sm cursor-pointer hover:shadow-amber-500/40 hover:scale-[1.01] active:scale-[0.99]">
            <span class="absolute inset-0 w-full h-full bg-white/20 transform -skew-x-12 -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></span>
            <span class="relative z-10 flex items-center gap-2">
              เข้าสู่ระบบระบบทะเบียน
              <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </span>
          </button>
        </div>
      </form>

      <!-- ข้อความช่วยเหลือ & ลืมรหัสผ่าน -->
      <div class="text-center pt-2">
        <p class="text-xs text-slate-500">
          ต้องการความช่วยเหลือ? <a href="#" class="text-slate-300 hover:text-amber-400 transition-colors font-medium">ติดต่อสำนักทะเบียน</a> หรือ <a href="#" class="text-amber-400 hover:text-amber-300 transition-colors font-medium underline">ลืมรหัสผ่าน?</a>
        </p>
      </div>
    </div>

  </div>
</div>
